plugins {
    id 'distribution'
    id 'com.gorylenko.gradle-git-properties' version 'latest.release'
}

// This module produces distribution archives, not a jar or resources.
// Disable processResources to avoid output directory conflicts.
processResources.enabled = false

dependencies {
    implementation project(':suramadu-server:suramadu-server-war')
    implementation project(':suramadu-server:suramadu-server-security')
    implementation project(':suramadu-api')
}

// ── Git info (JSON format) ───────────────────────────────────────────
gitProperties {
    failOnNoGitDirectory = false
    gitPropertiesResourceDir = layout.buildDirectory.dir('dist-meta').get().asFile
    gitPropertiesName = 'git.info'
}

// ── Copy version.info with token replacement ─────────────────────────
tasks.register('copyVersionInfo', Copy) {
    from('src/main/resources') {
        include 'version.info'
        expand(project: [version: project.version])
    }
    into layout.buildDirectory.dir('dist-meta')
}

// ── Main distribution ────────────────────────────────────────────────
def warProject = project(':suramadu-server:suramadu-server-war')

distributions {
    main {
        distributionBaseName = "suramadu"
        contents {
            from(warProject.layout.buildDirectory.dir('libs')) {
                include '*.war'
                into '/'
            }

            from(project(':suramadu-server:suramadu-server-security').layout.buildDirectory.dir('libs')) {
                include "suramadu-server-security-${project.version}.jar"
                into '/api'
            }

            from(project(':suramadu-api').layout.buildDirectory.dir('libs')) {
                include "suramadu-api-${project.version}.jar"
                into '/api'
            }

            from('src/main/demo') {
                into '/'
            }

            from(layout.buildDirectory.dir('dist-meta')) {
                include 'git.info'
                include 'version.info'
                into '/'
            }

            // ── SBOM (CycloneDX) ──────────────────────────────────────
            // Full (transitive) BOM generated at the root project via:
            //   ./gradlew --init-script init-cyclonedx.gradle build
            // 'cyclonedx-direct' stays internal (license/review use only).
            from(rootProject.layout.buildDirectory.dir('reports/cyclonedx')) {
                include 'bom.json'
                into '/'
                rename { 'sbom.json' }
            }

            // FIX: Replaced 'mode' with 'fileMode' for Gradle 9 configuration compliance
            filesMatching('**/*.sh') {
                permissions {
                    unix('rwxr-xr-x')
                }
            }
        }
    }
}

distZip {
    dependsOn ':suramadu-server:suramadu-server-war:assemble', 'copyVersionInfo', 'generateGitProperties'
    destinationDirectory = layout.buildDirectory.dir('dist')
}

distTar {
    dependsOn ':suramadu-server:suramadu-server-war:assemble', 'copyVersionInfo', 'generateGitProperties'
    destinationDirectory = layout.buildDirectory.dir('dist')
    compression = Compression.BZIP2
    archiveExtension = 'tar.bz2'
}

// ── SBOM wiring ──────────────────────────────────────────────────────
// Only active when the CycloneDX plugin is applied (init-script run);
// plain builds just warn and package without the SBOM.
rootProject.plugins.withId('org.cyclonedx.bom') {
    [tasks.named('distZip'), tasks.named('distTar')].each { t ->
        t.configure { dependsOn rootProject.tasks.named('cyclonedxBom') }
    }
}

[tasks.named('distZip'), tasks.named('distTar')].each { t ->
    t.configure {
        doFirst {
            def bom = rootProject.layout.buildDirectory.file('reports/cyclonedx/bom.json').get().asFile
            if (!bom.exists()) {
                logger.warn("WARNING: SBOM not found ({}) — distribution ships without sbom.json. " +
                        "Build with: ./gradlew --init-script init-cyclonedx.gradle build", bom)
            }
        }
    }
}

// Skip deploy (matches Maven config)
tasks.withType(PublishToMavenRepository).configureEach { enabled = false }

// Disable jar — this is a distribution-only module
tasks.withType(Jar).configureEach { enabled = false }

// ── Docker profile ───────────────────────────────────────────────────
if (project.hasProperty('docker')) {
    tasks.register('copyDockerfile', Copy) {
        from 'src/main/docker'
        include 'Dockerfile'
        into "${projectDir}/dist/docker"
    }

    distributions {
        docker {
            distributionBaseName = 'suramadu'
            contents {
                from(warProject.layout.buildDirectory.dir('libs')) {
                    include '*.war'
                    into '/'
                }
                from(layout.buildDirectory.dir('dist-meta')) {
                    include 'git.info'
                    include 'version.info'
                    into '/' // FIX: Provided explicit destination path structure
                }
            }
        }
    }

    tasks.named('dockerDistZip') {
        destinationDirectory = file("${projectDir}/dist/docker")
    }

    // FIX: Configured directly at task-definition root instead of wrapping in invalid execution hooks
    tasks.register('dockerBuild', Exec) {
        dependsOn 'dockerDistZip', 'copyDockerfile'
        workingDir "${projectDir}/dist/docker"
        commandLine 'docker', 'build', '-t', 'manticore-projects/suramadu', '.'
    }

    assemble.dependsOn 'dockerBuild'
}
