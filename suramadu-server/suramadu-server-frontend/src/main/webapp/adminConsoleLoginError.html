<!DOCTYPE html>
<html class="ws-fullscreen" lang="en">

<head>
    <title>VBox Login Error</title>
    <!--
        CSP: script-src 'self' blocks injected inline/external scripts.
        All JS lives in an external script — no unsafe-inline needed.
        connect-src includes ws:/wss: to allow the WebSocket connection.
        frame-src 'self' is required for the file-download iframe: the Java app
        writes a temp file and the server serves it via /file?id=... in an iframe;
        without this directive default-src 'none' blocks the frame and the
        browser never receives the download.
    -->
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'none'; connect-src 'self' ws: wss: data:; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; worker-src blob:; frame-src 'self';">
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css"/>
    <link rel="icon" href="favicon.ico"/>
    <style>
        /* Source and licence notice:
           AGPL-3.0 section 13 requires the source offer to be presented to
           users interacting with this server over a network. */
        .source-notice {
            position: fixed;
            right: 0.5rem;
            bottom: 0.4rem;
            z-index: 2147483000;
            font: 400 11px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
            color: #6e6e8a;
            background: rgba(255, 255, 255, 0.82);
            border-radius: 4px;
            padding: 2px 7px;
        }

        .source-notice a {
            color: #6e6e8a;
            text-decoration: underline;
            text-underline-offset: 2px;
        }

            color: #ff420e;
        }
    </style>
</head>

<body>
<div class="suramadu-element">

             role="dialog"

             aria-describedby="adminConsoleErrorDialog-description">
            <div class="ws-dialog">
                <div data-id="header" class="ws-header">
                    <h2 id="adminConsoleErrorDialog-title" class="ws-title" style="text-align: left;">Login Error</h2>
                </div>
                <div class="ws-dialog-content" style="padding-bottom: 48px;">

                    <button id="logoutButton" type="button" class="ws-btn-submit">Log out</button>

    </div>
</div>
