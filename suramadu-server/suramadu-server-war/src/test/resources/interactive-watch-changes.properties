enabled.watchers=webswingJs,directdrawJs

#comma separated paths with required executables relative to suramadu-home
environment.path=webswing/node

webswingJs.watchPaths=webswing/suramadu-server/suramadu-server-frontend/src/main/webapp/javascript,webswing/suramadu-server/suramadu-server-frontend/src/main/webapp/css
webswingJs.workDir=webswing/suramadu-server/suramadu-server-frontend
webswingJs.command=node ../../node/node_modules/npm/bin/npm-cli.js run rebuild

directdrawJs.watchPaths=webswing/suramadu-directdraw/suramadu-directdraw-javascript/src/main/webapp,webswing/suramadu-directdraw/src/proto/javascript
directdrawJs.workDir=webswing/suramadu-directdraw/suramadu-directdraw-javascript
directdrawJs.command=node ../../node/node_modules/npm/bin/npm-cli.js run rebuild
directdrawJs.triggers=webswingJs
