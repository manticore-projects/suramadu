# Semgrep SAST scan for Suramadu
# https://semgrep.dev/docs/semgrep-ci/sample-ci-configs
#
# Findings are reported to the GitHub Security tab rather than failing the
# build: a SAST scan of a large codebase always surfaces something, and a
# permanently red workflow gets ignored. Use branch protection or a required
# code-scanning check if a hard gate is wanted.
#
# Badge:
#   [![Semgrep](https://github.com/manticore-projects/suramadu/actions/workflows/semgrep.yml/badge.svg)](https://github.com/manticore-projects/suramadu/actions/workflows/semgrep.yml)

name: Semgrep

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  # Manual trigger from the Actions tab
  workflow_dispatch: {}
  # Weekly full scan (Saturday 06:00 UTC)
  schedule:
    - cron: "0 6 * * 6"

permissions:
  contents: read
  # Required for uploading SARIF to the GitHub Security tab
  security-events: write

jobs:
  semgrep:
    name: semgrep/scan
    runs-on: ubuntu-latest

    if: github.actor != 'dependabot[bot]'

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Semgrep runs on the runner rather than in a container: JavaScript
      # actions (checkout, upload-sarif, upload-artifact) need Node, which the
      # semgrep/semgrep image does not provide.
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install Semgrep
        run: pip install --disable-pip-version-check semgrep

      - name: Run Semgrep
        run: |
          semgrep scan \
            --config p/java \
            --config p/owasp-top-ten \
            --config p/security-audit \
            --config p/secrets \
            --sarif \
            --sarif-output semgrep-results.sarif \
            --metrics off \
            --no-error \
            --exclude 'build' \
            --exclude 'node_modules' \
            --exclude 'target' \
            --exclude 'dist' \
            --exclude '**/proto/**' \
            --exclude '**/*.min.js'

      # Semgrep writes nosemgrep-suppressed findings into the SARIF anyway (marked with
      # "suppressions"), and the GitHub Security tab shows them as open alerts. Strip them
      # before upload so inline nosemgrep annotations actually take effect.
      - name: Drop nosemgrep-suppressed findings from SARIF
        run: |
          jq 'del(.runs[].results[] | select(.suppressions and (.suppressions | length > 0)))' \
            semgrep-results.sarif > semgrep-results.filtered.sarif
          mv semgrep-results.filtered.sarif semgrep-results.sarif

      - name: Upload SARIF to the GitHub Security tab
        uses: github/codeql-action/upload-sarif@9418214df1f2c4b8128c770156c409013b07d6b9 # v3.39.3
        with:
          sarif_file: semgrep-results.sarif
        if: always()

      - name: Upload SARIF as artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: semgrep-results
          path: semgrep-results.sarif
          retention-days: 30
        if: always()