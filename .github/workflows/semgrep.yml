# Semgrep SAST scan for Suramadu
# https://semgrep.dev/docs/semgrep-ci/sample-ci-configs
#
# Findings are reported to the GitHub Security tab rather than failing the
# build: a SAST scan of a large codebase always surfaces something, and a
# permanently red workflow gets ignored. Use branch protection or a required
# code-scanning check if a hard gate is wanted.
#
# Badge:
#   [![Semgrep](https://github.com/manticore-projects/suramadu/actions/workflows/semgrep.yml/badge.svg)](https://github.com/manticore-projects/suramadu/actions/workflows/semgrep.yml)

name: Semgrep

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  # Manual trigger from the Actions tab
  workflow_dispatch: {}
  # Weekly full scan (Saturday 06:00 UTC)
  schedule:
    - cron: "0 6 * * 6"

permissions:
  contents: read
  # Required for uploading SARIF to the GitHub Security tab
  security-events: write

jobs:
  semgrep:
    name: semgrep/scan
    runs-on: ubuntu-latest

    if: github.actor != 'dependabot[bot]'

    steps:
      - uses: actions/checkout@v4

      # Semgrep runs on the runner rather than in a container: JavaScript
      # actions (checkout, upload-sarif, upload-artifact) need Node, which the
      # semgrep/semgrep image does not provide.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Semgrep
        run: pip install --disable-pip-version-check semgrep

      - name: Run Semgrep
        run: |
          semgrep scan \
            --config p/java \
            --config p/owasp-top-ten \
            --config p/security-audit \
            --config p/secrets \
            --sarif \
            --sarif-output semgrep-results.sarif \
            --metrics off \
            --no-error \
            --exclude 'build' \
            --exclude 'node_modules' \
            --exclude 'target' \
            --exclude 'dist' \
            --exclude '**/proto/**' \
            --exclude '**/*.min.js'

      - name: Upload SARIF to the GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep-results.sarif
        if: always()

      - name: Upload SARIF as artifact
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-results
          path: semgrep-results.sarif
          retention-days: 30
        if: always()