name: Build

on:
  push:
    branches: [ master, develop ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build on JDK ${{ matrix.java }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        java: [ '21' ]
        os: [ ubuntu-latest ]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # JDK 27 is the toolchain for suramadu-app-toolkit-java27; the matrix JDK
      # (listed last, so it becomes JAVA_HOME) runs Gradle and the other modules.
      # setup-java exports JAVA_HOME_27_X64, which Gradle picks up via fromEnv.
      - name: Set up JDK 27 + ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            27
            ${{ matrix.java }}

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/nodejs
          key: gradle-${{ runner.os }}-jdk${{ matrix.java }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/gradle.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-jdk${{ matrix.java }}-
            gradle-${{ runner.os }}-

      - name: Cache Node modules
        uses: actions/cache@v4
        with:
          path: |
            suramadu-directdraw/suramadu-directdraw-javascript/node_modules
            suramadu-server/suramadu-server-frontend/node_modules
          key: node-${{ runner.os }}-${{ hashFiles('**/package-lock.json', '**/package.json') }}
          restore-keys: |
            node-${{ runner.os }}-

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew clean assemble -x spotlessJava --no-daemon --warning-mode all -Porg.gradle.java.installations.fromEnv=JAVA_HOME_27_X64

      - name: Upload ZIP distribution
        if: matrix.java == '21' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: zip
          path: build/dist/suramadu-*.zip
          retention-days: 365
          if-no-files-found: warn

      - name: Upload TAR distribution
        if: matrix.java == '21' && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: tar
          path: build/dist/suramadu-*.tar.bz2
          retention-days: 365
          if-no-files-found: warn
