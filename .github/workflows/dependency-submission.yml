# Submits the Gradle dependency graph to GitHub, scoped to what the product
# actually ships: runtime classpaths only. Build tooling (plugin classpaths,
# build-logic, test/dev configurations) is deliberately excluded - those
# dependencies never leave the build machine, and their transitives (e.g. the
# dependency-check plugin's own BouncyCastle) were drowning the Dependabot
# alerts in noise that no customer ever receives.
#
# Prerequisite: "Automatic dependency submission" must be DISABLED in the
# repository settings (Settings -> Advanced Security), otherwise GitHub's
# unscoped automatic graph overwrites this one.
#
# Build-tooling currency is handled by pinned plugin versions and routine
# bumps, not by Dependabot alerts.

name: Dependency Graph

on:
  push:
    branches: ["master"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  dependency-submission:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JDK
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: |
            27
            25

      - name: Generate and submit dependency graph
        uses: gradle/actions/dependency-submission@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        env:
          # Only what ships: runtime classpaths of the product modules.
          DEPENDENCY_GRAPH_INCLUDE_CONFIGURATIONS: 'runtimeClasspath'
          # Build tooling is not a deliverable.
          DEPENDENCY_GRAPH_EXCLUDE_PROJECTS: ':build-logic|:buildSrc'
        with:
          build-root-directory: .