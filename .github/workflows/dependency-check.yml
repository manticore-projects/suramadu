# OWASP Dependency-Check CVE scan for Suramadu
#
# Backs the README "CVE Scan" badge: build.gradle sets failBuildOnCVSS = 0, so this
# workflow is green only when the resolved Java runtime classpath and the npm lockfiles
# contain zero unsuppressed CVEs of any severity. False positives are triaged in
# config/dependency-check/suppressions.xml with review notes — in-repo and auditable.
#
# Runs weekly as well as on push: CVEs are published against existing releases, so a
# scan that only runs on code changes goes stale.
#
# The optional NVD_API_KEY repository secret (free key from
# https://nvd.nist.gov/developers/request-an-api-key) speeds up the NVD data download
# considerably; without it the first run on a cold cache can take a long time.
#
# Badge:
#   [![CVE Scan](https://github.com/manticore-projects/suramadu/actions/workflows/dependency-check.yml/badge.svg)](https://github.com/manticore-projects/suramadu/actions/workflows/dependency-check.yml)

name: CVE Scan

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  # Weekly, offset from the Semgrep (06:00) and CodeQL (07:00) Saturday scans
  schedule:
    - cron: "0 8 * * 6"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  dependency-check:
    name: OWASP Dependency-Check
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      # contents: write is needed to push the badge JSON to the 'badges' branch
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Same toolchain setup as Gradle.yml: JDK 27 for the suramadu-app-toolkit-java27
      # toolchain, JDK 21 (listed last, so JAVA_HOME) to run Gradle itself.
      - name: Set up JDK 27 + 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: |
            27
            21

      - name: Cache Gradle packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-depcheck-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/gradle.properties') }}
          restore-keys: |
            gradle-depcheck-${{ runner.os }}-

      # The NVD database is refreshed on every run and saved under a unique key, so the
      # next run restores the most recent copy and only downloads the delta.
      - name: Cache NVD database
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.gradle/dependency-check-data
          key: nvd-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            nvd-${{ runner.os }}-

      - name: Grant execute permission
        run: chmod +x gradlew

      # --no-parallel overrides org.gradle.parallel=true from gradle.properties:
      # dependencyCheckAggregate resolves the subprojects' runtimeClasspath from the root
      # project at execution time, which Gradle rejects under parallel project execution
      # ("Resolution of the configuration ... was attempted without an exclusive lock").
      # continue-on-error so the badge below gets published first; the final step
      # re-raises the failure.
      - name: Run Dependency-Check
        id: odc
        continue-on-error: true
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          ./gradlew dependencyCheckAggregate \
            --no-daemon \
            --no-parallel \
            --no-configuration-cache \
            -Porg.gradle.java.installations.fromEnv=JAVA_HOME_27_X64

      # The README "Known CVEs" badge shows the distinct unsuppressed CVE count from the
      # JSON report of this very scan; every value ever shown is in the 'badges' branch
      # history. A failed scan without a report publishes "error" rather than a stale "0".
      - name: Count CVEs
        id: cves
        if: github.ref == 'refs/heads/master'
        run: |
          report=build/reports/dependency-check-report.json
          if [ -f "$report" ]; then
            count=$(jq '[.dependencies[]?.vulnerabilities[]?.name] | unique | length' "$report")
            echo "Distinct unsuppressed CVEs: $count"
            echo "message=$count" >> "$GITHUB_OUTPUT"
            if [ "$count" -gt 0 ]; then
              echo "color=red" >> "$GITHUB_OUTPUT"
              jq -r '.dependencies[]? | select(.vulnerabilities) | .fileName as $f | .vulnerabilities[] | "\($f): \(.name) (\(.severity))"' "$report"
            else
              echo "color=brightgreen" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "message=error" >> "$GITHUB_OUTPUT"
            echo "color=lightgrey" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish badge
        if: github.ref == 'refs/heads/master'
        uses: ./.github/actions/publish-badge
        with:
          token: ${{ github.token }}
          file: cve.json
          label: Known CVEs
          message: ${{ steps.cves.outputs.message }}
          color: ${{ steps.cves.outputs.color }}

      - name: Fail on CVEs or scan errors
        if: steps.odc.outcome == 'failure'
        run: exit 1

      # The report is the verifiable evidence behind the badge
      - name: Upload Dependency-Check report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dependency-check-report
          path: build/reports/dependency-check-report.html
          retention-days: 90
        if: always()
