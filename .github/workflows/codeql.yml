# CodeQL analysis for Suramadu
#
# Java is analysed in 'manual' build mode: the project is compiled so that
# CodeQL sees resolved types and can follow dataflow through the call graph.
# JavaScript and TypeScript need no build and use 'none'.
#
# Four modules deliberately declare classes under fully-qualified names that
# already exist elsewhere, and CodeQL scans only one of each clashing pair:
#
#   suramadu-app-toolkit-java11     JDK 11+ / 27+ variants of WebToolkit,
#   suramadu-app-toolkit-java27     WebClipboardTransferable, WindowManager,
#   suramadu-app-toolkit-fx-java11  Util and WebJSObject. Exactly one variant
#                                   is placed on the classpath at runtime.
#
#   suramadu-modpatch/*             sun.awt.PlatformGraphicsInfo and
#                                   netscape.javascript.JSObject, injected via
#                                   --patch-module to replace their JDK
#                                   counterparts. They shadow the JDK by design.
#
# Those are excluded below. The base implementations they mirror are scanned
# in full.

name: "CodeQL"

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  schedule:
    # Weekly, offset from the Semgrep scan so the two do not contend
    - cron: "0 7 * * 6"
  workflow_dispatch: {}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    # The Java build pulls Node and the full dependency tree; an overrun should
    # fail fast rather than idle against the default six-hour limit.
    timeout-minutes: 60

    permissions:
      # Required to upload results to the Security tab
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: manual
          - language: javascript-typescript
            build-mode: none

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # JDK 27 is the toolchain for suramadu-app-toolkit-java27 (found via
      # JAVA_HOME_27_X64, see Build step); JDK 25, listed last, becomes
      # JAVA_HOME and runs Gradle.
      - name: Set up JDK
        if: matrix.build-mode == 'manual'
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: |
            27
            25

      # cache-disabled: CodeQL's manual build mode builds its database by
      # tracing javac invocations. A restored Gradle cache turns every
      # compileJava task into UP-TO-DATE / FROM-CACHE, no compiler runs,
      # the database stays empty and the analyze step fails with
      # "didn't build any of it". This scan must always compile for real.
      - name: Set up Gradle
        if: matrix.build-mode == 'manual'
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
        with:
          cache-disabled: true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9418214df1f2c4b8128c770156c409013b07d6b9 # v3.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config: |
            paths-ignore:
              # JDK-version variants: same fully-qualified names as the base
              # modules, only one of which is ever on the classpath.
              - 'suramadu-app-toolkit-java11/**'
              - 'suramadu-app-toolkit-java27/**'
              - 'suramadu-app-toolkit-fx-java11/**'

              # Shims that deliberately shadow JDK classes via --patch-module.
              - 'suramadu-modpatch/**'

              # Generated and vendored code
              - '**/proto/**'
              - '**/*Proto.java'
              - '**/*ProtoIn.java'
              - '**/*ProtoOut.java'
              - '**/node_modules/**'
              - '**/*.min.js'

              # Build output
              - '**/build/**'
              - '**/target/**'
              - '**/dist/**'

      # Compile only. Tests, formatting and the other quality gates run in their
      # own workflows; repeating them here would slow the scan and make it fail
      # for reasons unrelated to security analysis.
      #
      # clean + --no-build-cache force actual javac runs for the CodeQL tracer
      # (see the setup-gradle note above); org.gradle.caching=true in
      # gradle.properties would otherwise serve everything from cache.
      - name: Build
        if: matrix.build-mode == 'manual'
        run: |
          ./gradlew clean classes \
            --no-daemon \
            --no-build-cache \
            --stacktrace \
            -Porg.gradle.java.installations.fromEnv=JAVA_HOME_27_X64 \
            -x check

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9418214df1f2c4b8128c770156c409013b07d6b9 # v3.39.3
        with:
          category: "/language:${{ matrix.language }}"

  # Badge + gate: the README "CodeQL Findings" badge shows the open-alert count this job
  # publishes, so the number is produced by the scan itself and every value ever shown is
  # in the 'badges' branch history. The analyze jobs wait for SARIF processing before
  # returning, so the alert list queried here already reflects this very scan. Alerts
  # triaged in the Security tab (false positive / won't fix) are 'dismissed' and
  # intentionally do not count as open. Any count above zero fails the workflow.
  findings-badge:
    name: Publish findings badge
    needs: analyze
    if: needs.analyze.result == 'success' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      security-events: read
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Count open CodeQL alerts on master
        id: alerts
        env:
          GH_TOKEN: ${{ github.token }}
          ALERTS: repos/${{ github.repository }}/code-scanning/alerts?tool_name=CodeQL&ref=refs/heads/master&state=open&per_page=100
        run: |
          count=$(gh api --paginate "$ALERTS" --jq length | awk '{s+=$1} END {print s+0}')
          echo "Open CodeQL alerts on master: $count"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          if [ "$count" -gt 0 ]; then
            echo "color=red" >> "$GITHUB_OUTPUT"
            gh api --paginate "$ALERTS" --jq \
              '.[] | "#\(.number) \(.rule.id) \(.most_recent_instance.location.path):\(.most_recent_instance.location.start_line)"'
          else
            echo "color=brightgreen" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish badge
        uses: ./.github/actions/publish-badge
        with:
          token: ${{ github.token }}
          file: codeql.json
          label: CodeQL Findings
          message: ${{ steps.alerts.outputs.count }}
          color: ${{ steps.alerts.outputs.color }}

      - name: Fail if open CodeQL alerts exist
        if: steps.alerts.outputs.count != '0'
        run: exit 1