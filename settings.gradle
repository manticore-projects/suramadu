pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenCentral()
    }
}

dependencyResolutionManagement {
    // PREFER_PROJECT: allows plugins (e.g. node-gradle) to add their own repos
    repositoriesMode.set(RepositoriesMode.PREFER_PROJECT)
    repositories {
        mavenLocal()
        mavenCentral()
    }
}

rootProject.name = 'suramadu'

// ── Flat modules ──────────────────────────────────────────────────────
include 'suramadu-api'
include 'suramadu-app-toolkit'
include 'suramadu-app-toolkit-fx'
include 'suramadu-app-toolkit-fx-java11'
include 'suramadu-app-toolkit-java11'
include 'suramadu-app-launcher'
include 'suramadu-app-services'

// ── Directdraw (nested) ──────────────────────────────────────────────
include 'suramadu-directdraw:suramadu-directdraw-swing'
include 'suramadu-directdraw:suramadu-directdraw-javascript'

// ── Server (nested) ──────────────────────────────────────────────────
include 'suramadu-server:suramadu-server-common'
include 'suramadu-server:suramadu-sessionpool-api'
include 'suramadu-server:suramadu-server-api'
include 'suramadu-server:suramadu-server-security'
include 'suramadu-server:suramadu-server-launcher'
include 'suramadu-server:suramadu-server-frontend'
include 'suramadu-server:suramadu-server-war'

// ── Modpatch (nested) ────────────────────────────────────────────────
include 'suramadu-modpatch:modpatch-java-desktop'
include 'suramadu-modpatch:modpatch-jdk-jsobject'

// ── Assembly ─────────────────────────────────────────────────────────
include 'suramadu-assembly'
